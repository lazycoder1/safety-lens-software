services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: safetylens
      POSTGRES_PASSWORD: safetylens
      # Create both databases on first boot
      POSTGRES_DB: safetylens
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetylens"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
