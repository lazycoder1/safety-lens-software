services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rakshak_lens
      POSTGRES_USER: rakshak_lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakshak_lens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakshak_lens"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SAFETYLENS_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://rakshak_lens:${POSTGRES_PASSWORD:-rakshak_lens}@db:5432/rakshak_lens
      SAFETYLENS_CONFIG_STORE: postgres
      SAFETYLENS_STATE_DIR: /var/lib/safetylens
      JWT_SECRET: ${JWT_SECRET:-}
      SAFETYLENS_CONFIG_REFRESH_SECONDS: ${SAFETYLENS_CONFIG_REFRESH_SECONDS:-2.0}
      MJPEG_MAX_SUBSCRIBERS_PER_CAMERA: ${MJPEG_MAX_SUBSCRIBERS_PER_CAMERA:-16}
      MJPEG_MAX_SUBSCRIBERS_TOTAL: ${MJPEG_MAX_SUBSCRIBERS_TOTAL:-64}
      ALERT_PERSIST_QUEUE_SIZE: ${ALERT_PERSIST_QUEUE_SIZE:-256}
      ALERT_DELIVERY_QUEUE_SIZE: ${ALERT_DELIVERY_QUEUE_SIZE:-256}
      ALERT_DELIVERY_RETRY_QUEUE_SIZE: ${ALERT_DELIVERY_RETRY_QUEUE_SIZE:-256}
      ALERT_DELIVERY_WORKERS: ${ALERT_DELIVERY_WORKERS:-1}
      ALERT_DELIVERY_ATTEMPTS: ${ALERT_DELIVERY_ATTEMPTS:-5}
      ALERT_DELIVERY_RETRY_DELAY_SECONDS: ${ALERT_DELIVERY_RETRY_DELAY_SECONDS:-1.0}
      ALERT_DELIVERY_RETRY_CAP_SECONDS: ${ALERT_DELIVERY_RETRY_CAP_SECONDS:-60}
      ALERT_DELIVERY_MAX_AGE_SECONDS: ${ALERT_DELIVERY_MAX_AGE_SECONDS:-900}
      ALERT_DELIVERY_PRIORITY_AGING_SECONDS: ${ALERT_DELIVERY_PRIORITY_AGING_SECONDS:-60}
      ALERT_OUTBOX_WORKERS: ${ALERT_OUTBOX_WORKERS:-3}
      ALERT_OUTBOX_LEASE_SECONDS: ${ALERT_OUTBOX_LEASE_SECONDS:-60}
      ALERT_OUTBOX_POLL_SECONDS: ${ALERT_OUTBOX_POLL_SECONDS:-5}
      ALERT_PERSISTENCE_STALE_SECONDS: ${ALERT_PERSISTENCE_STALE_SECONDS:-30}
      ALERT_DELIVERY_RETENTION_DAYS: ${ALERT_DELIVERY_RETENTION_DAYS:-14}
      ALERT_DELIVERY_TERMINAL_RETENTION_DAYS: ${ALERT_DELIVERY_TERMINAL_RETENTION_DAYS:-90}
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: ${WEBHOOK_ALLOWED_PRIVATE_HOSTS:-}
      WEBHOOK_ALLOWED_HTTP_HOSTS: ${WEBHOOK_ALLOWED_HTTP_HOSTS:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      SAFETYLENS_VLM_TIMEOUT_SECONDS: ${SAFETYLENS_VLM_TIMEOUT_SECONDS:-60}
    volumes:
      - snapshots:/app/backend/snapshots
      - face_photos:/app/backend/face_photos
      - face_snapshots:/app/backend/face_snapshots
      - runtime_state:/var/lib/safetylens
      - models:/app/models
      - ./logs:/app/backend/logs
      - ./test-videos:/app/test-videos:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  snapshots:
  face_photos:
  face_snapshots:
  runtime_state:
  models:
