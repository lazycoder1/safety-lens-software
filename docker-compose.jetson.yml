services:
  edge:
    # NVIDIA env flags and media devices do not provide CUDA driver injection;
    # without this runtime GStreamer blacklists the Jetson decoder plug-ins.
    runtime: nvidia
    build:
      context: .
      dockerfile: Dockerfile.edge-jetson
    environment:
      SAFETYLENS_RTSP_CAPTURE_BACKEND: nvdec
      SAFETYLENS_RTSP_MAX_DIMENSION: ${SAFETYLENS_RTSP_MAX_DIMENSION:-640}
      SAFETYLENS_RTSP_CAPTURE_FPS_CAP: ${SAFETYLENS_RTSP_CAPTURE_FPS_CAP:-6}
      SAFETYLENS_NVDEC_DROP_FRAME_INTERVAL: ${SAFETYLENS_NVDEC_DROP_FRAME_INTERVAL:-0}
      SAFETYLENS_REMOTE_INFERENCE_MAX_INFLIGHT: ${SAFETYLENS_REMOTE_INFERENCE_MAX_INFLIGHT:-4}
      SAFETYLENS_REMOTE_INFERENCE_ADMISSION_WAIT_SECONDS: ${SAFETYLENS_REMOTE_INFERENCE_ADMISSION_WAIT_SECONDS:-0.125}
      SAFETYLENS_REMOTE_PRIMARY_BATCH_WAIT_SECONDS: ${SAFETYLENS_REMOTE_PRIMARY_BATCH_WAIT_SECONDS:-0.014}
      SAFETYLENS_REMOTE_SPECIALIST_BATCH_WAIT_SECONDS: ${SAFETYLENS_REMOTE_SPECIALIST_BATCH_WAIT_SECONDS:-0.014}
      SAFETYLENS_REMOTE_FRAME_BATCH_SIZE: ${SAFETYLENS_REMOTE_FRAME_BATCH_SIZE:-4}
      SAFETYLENS_REMOTE_BATCH2_EARLY_FLUSH_SECONDS: ${SAFETYLENS_REMOTE_BATCH2_EARLY_FLUSH_SECONDS:-0.006}
      SAFETYLENS_REMOTE_PRIMARY_BATCH_IMGSZ: ${SAFETYLENS_REMOTE_PRIMARY_BATCH_IMGSZ:-640}
      SAFETYLENS_REMOTE_RTDETR_PHONE_BATCH_WAIT_SECONDS: ${SAFETYLENS_REMOTE_RTDETR_PHONE_BATCH_WAIT_SECONDS:-0.014}
      SAFETYLENS_INFERENCE_PHASE_GROUP_SIZE: ${SAFETYLENS_INFERENCE_PHASE_GROUP_SIZE:-4}
      SAFETYLENS_INFERENCE_PHASE_REMAINDER_WEIGHT: ${SAFETYLENS_INFERENCE_PHASE_REMAINDER_WEIGHT:-0.70}
      SAFETYLENS_CAMERA_STARTUP_STAGGER_SECONDS: ${SAFETYLENS_CAMERA_STARTUP_STAGGER_SECONDS:-0.10}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/tegra
    volumes:
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvideo4linux2.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvideo4linux2.so:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvidconv.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvidconv.so:ro
      - /usr/lib/aarch64-linux-gnu/libv4l/plugins:/usr/lib/aarch64-linux-gnu/libv4l/plugins:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
    # JetPack 5's generic GPU reservation does not expose the media-engine
    # nodes needed by nvv4l2decoder/nvvidconv. Without these mappings the
    # configured NVDEC backend silently falls back to CPU FFmpeg decoding.
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvhost-gpu:/dev/nvhost-gpu
      - /dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu
      - /dev/nvmap:/dev/nvmap
      - /dev/nvhost-ctrl:/dev/nvhost-ctrl
      - /dev/nvhost-nvdec:/dev/nvhost-nvdec
      - /dev/nvhost-ctrl-nvdec:/dev/nvhost-ctrl-nvdec
      - /dev/nvhost-vic:/dev/nvhost-vic
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-server:
    build:
      context: .
      dockerfile: Dockerfile.model-server-jetson
    environment:
      SAFETYLENS_COCO_BATCH2_TENSORRT_ENGINE: ${SAFETYLENS_COCO_BATCH2_TENSORRT_ENGINE:-}
      SAFETYLENS_PPE_BATCH2_TENSORRT_ENGINE: ${SAFETYLENS_PPE_BATCH2_TENSORRT_ENGINE:-}
      SAFETYLENS_COCO_BATCH4_TENSORRT_ENGINE: ${SAFETYLENS_COCO_BATCH4_TENSORRT_ENGINE:-}
      SAFETYLENS_PPE_BATCH4_TENSORRT_ENGINE: ${SAFETYLENS_PPE_BATCH4_TENSORRT_ENGINE:-}
      SAFETYLENS_RTDETR_PHONE_BATCH1_TENSORRT_ENGINE: ${SAFETYLENS_RTDETR_PHONE_BATCH1_TENSORRT_ENGINE:-}
      SAFETYLENS_RTDETR_PHONE_BATCH1_ENGINE_SHA256: ${SAFETYLENS_RTDETR_PHONE_BATCH1_ENGINE_SHA256:-}
      SAFETYLENS_RTDETR_PHONE_BATCH2_TENSORRT_ENGINE: ${SAFETYLENS_RTDETR_PHONE_BATCH2_TENSORRT_ENGINE:-}
      SAFETYLENS_RTDETR_PHONE_BATCH2_ENGINE_SHA256: ${SAFETYLENS_RTDETR_PHONE_BATCH2_ENGINE_SHA256:-}
      SAFETYLENS_SPECIALIST_BATCH_CONCURRENT: ${SAFETYLENS_SPECIALIST_BATCH_CONCURRENT:-false}
